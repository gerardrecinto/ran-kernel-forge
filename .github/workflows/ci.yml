name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate profiles and scripts
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Check DU profile required options
        run: |
          grep -q 'CONFIG_PREEMPT_RT=y'  profiles/du-profile.config
          grep -q 'CONFIG_NO_HZ_FULL=y'  profiles/du-profile.config
          grep -q 'CONFIG_VFIO_PCI=y'    profiles/du-profile.config
          grep -q 'CONFIG_HUGETLBFS=y'   profiles/du-profile.config
          echo "DU profile OK"

      - name: Check CU profile required options
        run: |
          grep -q 'CONFIG_NET_SCHED=y'   profiles/cu-profile.config
          echo "CU profile OK"

      - name: Check RU profile required options
        run: |
          grep -q 'CONFIG_PREEMPT_RT=y'      profiles/ru-profile.config
          grep -q 'CONFIG_PTP_1588_CLOCK=y'  profiles/ru-profile.config
          grep -q 'CONFIG_NET_SCH_ETF=y'     profiles/ru-profile.config
          grep -q 'CONFIG_NET_SCH_TAPRIO=y'  profiles/ru-profile.config
          echo "RU profile OK"

      - name: Lint shell scripts
        run: |
          sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Lint and unit tests
        run: |
          pip install ruff==0.15.20 pytest==9.0.3 bandit==1.9.4
          ruff check tests/
          bandit -r tests/ -ll
          pytest tests/test_checks.py -v

      - name: Run latency check (quick — checks expected to fail on non-RT runner)
        run: python3 tests/latency_check.py --quick --json | python3 -m json.tool

  build:
    name: Build ${{ matrix.profile }} container
    runs-on: ubuntu-22.04
    needs: validate
    strategy:
      matrix:
        profile: [du, cu, ru]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v6
        with:
          path: /tmp/.buildx-cache-${{ matrix.profile }}
          key: buildx-${{ matrix.profile }}-${{ github.sha }}
          restore-keys: buildx-${{ matrix.profile }}-

      - name: Build ${{ matrix.profile }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/${{ matrix.profile }}/Dockerfile
          push: false
          tags: ran-kernel-forge/${{ matrix.profile }}:ci
          cache-from: type=local,src=/tmp/.buildx-cache-${{ matrix.profile }}
          cache-to: type=local,dest=/tmp/.buildx-cache-${{ matrix.profile }}-new,mode=max

      - name: Rotate cache
        run: |
          rm -rf /tmp/.buildx-cache-${{ matrix.profile }}
          mv /tmp/.buildx-cache-${{ matrix.profile }}-new /tmp/.buildx-cache-${{ matrix.profile }}
