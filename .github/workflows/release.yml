name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release-containers:
    name: Publish ${{ matrix.profile }} container
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        profile: [du, cu, ru]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/ran-kernel-forge-${{ matrix.profile }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.vendor=gerardrecinto
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: containers/${{ matrix.profile }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/ran-kernel-forge-${{ matrix.profile }}
          subject-digest: ${{ steps.push.outputs.digest }}

  create-release:
    name: GitHub Release
    runs-on: ubuntu-22.04
    needs: release-containers
    steps:
      - uses: actions/checkout@v4

      - name: Build release body
        run: |
          TAG=${{ github.ref_name }}
          cat > release-body.md << 'BODY'
          ## Container images

          | Profile | Image | Architectures |
          |---------|-------|--------------|
          | DU | `ghcr.io/gerardrecinto/ran-kernel-forge-du:TAG` | linux/amd64, linux/arm64 |
          | CU | `ghcr.io/gerardrecinto/ran-kernel-forge-cu:TAG` | linux/amd64, linux/arm64 |
          | RU | `ghcr.io/gerardrecinto/ran-kernel-forge-ru:TAG` | linux/amd64, linux/arm64 |

          SBOM and provenance attestations are embedded in each image via OCI referrers.

          ```
          docker buildx imagetools inspect ghcr.io/gerardrecinto/ran-kernel-forge-du:TAG
          ```
          BODY
          sed -i "s/TAG/${TAG}/g" release-body.md

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: release-body.md
